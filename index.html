<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>CampusSafe Alert</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one-screen phone app. Schematic map on top, task panel below, four-tab bar at the bottom.
   Colour: deep teal brand; red is reserved for SOS and danger; map risk uses green / amber / red. */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --ink:#14211F; --muted:#586966; --line:#D5DEDC; --chip:#E3EAE8;
  --brand:#0E6B63; --brand-ink:#FFFFFF; --sos:#D3243B; --sos-ink:#FFFFFF;
  --safe:#2F9E6D; --mid:#E0A22A; --danger:#D6423C;
  --safe-t:#1F7A52; --mid-t:#8A5B00; --danger-t:#B3261E;
  --map-bg:#E6ECEA; --block:#D4DDDA; --park:#BFDCC8; --tree:#9CC7AC; --parktxt:#2E6B48;
  --street:#FFFFFF; --street-edge:#BFCBC8; --lamp:#F2B632; --me:#2563EB; --help:#0E6B63;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1312; --surface:#141E1D; --ink:#E6EFED; --muted:#8FA3A0; --line:#253533; --chip:#1C2A28;
    --brand:#4DC2B2; --brand-ink:#06201C; --sos:#E03B4E; --sos-ink:#FFFFFF;
    --safe:#43C08A; --mid:#E8B341; --danger:#EF5D56;
    --safe-t:#43C08A; --mid-t:#E8B341; --danger-t:#F2706A;
    --map-bg:#101A19; --block:#1A2927; --park:#1F3A2E; --tree:#2A4D3C; --parktxt:#8FCBA8;
    --street:#2B3D3B; --street-edge:#0B1110; --lamp:#F5C253; --me:#6FA0FF; --help:#4DC2B2;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1312; --surface:#141E1D; --ink:#E6EFED; --muted:#8FA3A0; --line:#253533; --chip:#1C2A28;
  --brand:#4DC2B2; --brand-ink:#06201C; --sos:#E03B4E; --sos-ink:#FFFFFF;
  --safe:#43C08A; --mid:#E8B341; --danger:#EF5D56;
  --safe-t:#43C08A; --mid-t:#E8B341; --danger-t:#F2706A;
  --map-bg:#101A19; --block:#1A2927; --park:#1F3A2E; --tree:#2A4D3C; --parktxt:#8FCBA8;
  --street:#2B3D3B; --street-edge:#0B1110; --lamp:#F5C253; --me:#6FA0FF; --help:#4DC2B2;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;
}
button,select{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--me);outline-offset:2px}
.app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-top:8px;min-height:0}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px 10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand svg{flex:none;color:var(--brand)}
.name{font-size:16px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.sub{font-size:11px;color:var(--muted);line-height:1.2}
.ctl{display:flex;align-items:center;gap:8px}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:2px}
.seg button{border:0;background:transparent;padding:6px 9px;border-radius:8px;font-size:12px;font-weight:700;color:var(--muted);min-height:32px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.tod{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 10px;font-size:12px;font-weight:700;min-height:36px}

/* map */
.mapwrap{flex:0 0 38%;min-height:180px;max-height:360px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--map-bg)}
.mapwrap svg{display:block;width:100%;height:100%;touch-action:manipulation}
.bg{fill:var(--map-bg)}
.blk{fill:var(--block)}
.park{fill:var(--park)}
.tree{fill:var(--tree)}
.parklbl{fill:var(--parktxt);font-size:9px;font-weight:600}
.st-casing{stroke:var(--street-edge);stroke-width:7;stroke-linecap:round}
.st-in{stroke:var(--street);stroke-width:4;stroke-linecap:round}
.st-in.c-safe{stroke:var(--safe)}
.st-in.c-mid{stroke:var(--mid)}
.st-in.c-danger{stroke:var(--danger)}
.heat line{stroke-width:24;stroke-linecap:round;opacity:.5}
.h-safe{stroke:var(--safe)}
.h-mid{stroke:var(--mid)}
.h-danger{stroke:var(--danger)}
.lamp{fill:var(--lamp)}
.sel-edge{stroke:var(--me);stroke-width:12;opacity:.3;stroke-linecap:round}
.r-casing{stroke:var(--surface);stroke-width:9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.r-safe{stroke:var(--brand);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.r-short{stroke:var(--danger);stroke-width:4;stroke-dasharray:6 6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.hp{fill:var(--help);stroke:var(--surface);stroke-width:2}
.hp-x{stroke:#fff;stroke-width:2.2;stroke-linecap:round}
.pl{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.lbl{font-size:10px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--map-bg);stroke-width:3px;stroke-linejoin:round}
.lbl.h{fill:var(--brand)}
.me-halo{fill:var(--me);opacity:.25;transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
.tg-halo{fill:var(--help);transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-out infinite}
.me-dot{fill:var(--me);stroke:#fff;stroke-width:2.5}
.rep{fill:var(--danger);stroke:var(--surface);stroke-width:2}
.repx{fill:#fff;font-size:10px;font-weight:800;text-anchor:middle}
.rs-a{fill:var(--surface);stroke:var(--brand);stroke-width:3}
.rs-b{fill:var(--brand);stroke:var(--surface);stroke-width:2}
@keyframes pulse{0%{transform:scale(.6);opacity:.5}100%{transform:scale(1.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.me-halo,.tg-halo{animation:none}}

/* panel */
.panel{flex:1 1 0;min-height:0;overflow-y:auto;padding-bottom:10px;overscroll-behavior:contain}
.h3{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.h3:first-child{margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;min-height:38px;display:inline-flex;align-items:center;gap:7px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:12px 0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.d-safe{background:var(--safe)}.d-mid{background:var(--mid)}.d-danger{background:var(--danger)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.card + .card{margin-top:10px}
.hint{color:var(--muted);font-size:14px}
.note{color:var(--muted);font-size:12px;margin:12px 0 0}
.ttl{font-weight:700;font-size:16px;line-height:1.25}
.tag{font-size:12px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;margin-top:10px;font-size:13px;color:var(--muted)}
.bar{height:7px;border-radius:4px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.score{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.t-safe{color:var(--safe-t)}.t-mid{color:var(--mid-t)}.t-danger{color:var(--danger-t)}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}

/* route */
.ft{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px}
.ft .a{grid-column:1;grid-row:1}.ft .b{grid-column:1;grid-row:2}
.ft .sw{grid-column:2;grid-row:1 / 3;align-self:center;height:44px;width:44px;border:1px solid var(--line);background:var(--surface);border-radius:12px;display:grid;place-items:center}
.fl{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:44px;font-size:14px}
.rt{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:2px 12px;align-items:center}
.rt svg{grid-row:1 / 3}
.rt .s{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.rt .p{grid-row:1 / 3;grid-column:3;text-align:right}
.rt .p b{font-size:22px;font-weight:800;display:block;line-height:1;font-variant-numeric:tabular-nums}
.rt .p span{font-size:11px;color:var(--muted)}
.sum{margin-top:12px;font-size:14px}

/* sos */
.alert{border:1px solid var(--sos);border-radius:14px;padding:12px 14px;background:var(--surface)}
.alert b.l{display:block;font-size:14px;margin-bottom:2px}
.alert .m{font-size:12px;color:var(--muted);margin-bottom:10px}
.phones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.phone{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 4px;border-radius:12px;border:1px solid var(--line);background:var(--bg);text-decoration:none;color:var(--ink)}
.phone b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.phone span{font-size:11px;color:var(--muted);text-align:center;line-height:1.2}
.sosbtn{width:100%;border:0;border-radius:16px;background:var(--sos);color:var(--sos-ink);font-weight:800;font-size:17px;padding:15px;min-height:56px;margin-top:12px}
.warn{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--chip);font-size:13px}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;min-height:54px}
.row[aria-pressed="true"]{border:2px solid var(--brand);padding:8px 11px}
.row .n{font-weight:600;font-size:14px}
.row .d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.badge{font-size:11px;font-weight:700;color:var(--brand-ink);background:var(--brand);border-radius:999px;padding:2px 8px;white-space:nowrap}
.share{margin-top:10px;padding:10px 12px;border-radius:10px;border:1px dashed var(--line);font-size:14px;user-select:all;-webkit-user-select:all}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px;min-height:44px}
.btn.p{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.rlist{display:flex;flex-direction:column;gap:8px}
.ritem{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.ritem small{display:block;color:var(--muted);font-size:12px}
.x{border:0;background:var(--chip);width:34px;height:34px;border-radius:10px;font-size:18px;line-height:1}

/* nav */
.nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:6px 0 8px;border-top:1px solid var(--line)}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;font-size:11px;font-weight:700;color:var(--muted);min-height:50px}
.nav button[aria-current="page"]{color:var(--brand);background:var(--chip)}
.nav button.sos{color:var(--sos)}
.nav button.sos[aria-current="page"]{background:var(--sos);color:var(--sos-ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 84px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;max-width:calc(100% - 32px);text-align:center;z-index:20}
</style>
</head>
<body>


<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5l8 3v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10v-6z"/><path d="M8.5 12l2.4 2.4 4.6-4.8"/></svg>
      <div><div class="name">CampusSafe Alert</div><div class="sub" id="sub"></div></div>
    </div>
    <div class="ctl">
      <div class="seg" role="group" aria-label="Тіл / Язык">
        <button data-act="lang" data-v="kk">ҚАЗ</button>
        <button data-act="lang" data-v="ru">РУС</button>
      </div>
      <button class="tod" id="tod" data-act="tod"></button>
    </div>
  </header>
  <div class="mapwrap" id="map"></div>
  <main class="panel" id="panel"></main>
  <nav class="nav" id="nav"></nav>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
'use strict';

/*LOGIC-START*/
const SCALE=2;   // метров на единицу карты
const WALK=80;   // метров в минуту пешком
const NODES={A:[40,40],B:[140,40],C:[240,40],D:[330,40],E:[40,130],F:[140,130],G:[240,130],H:[330,130],
             I:[40,220],J:[140,220],K:[240,220],L:[330,220],M:[40,310],N:[140,310],O:[240,310],P:[330,310]};
// a, b, освещённость 0..1, людской поток 0..1
const RAW=[
 ['A','B',.9,.8],['B','C',.8,.7],['C','D',.6,.5],
 ['E','F',.9,.9],['F','G',.9,.9],['G','H',.7,.6],
 ['I','J',.5,.4],['J','K',.2,.1],['K','L',.6,.6],
 ['M','N',.4,.3],['N','O',.2,.1],['O','P',.7,.7],
 ['A','E',.9,.8],['E','I',.6,.5],['I','M',.4,.3],
 ['B','F',.9,.8],['F','J',.7,.6],['J','N',.2,.1],
 ['C','G',.8,.7],['G','K',.6,.5],['K','O',.2,.1],
 ['D','H',.6,.4],['H','L',.7,.7],['L','P',.8,.8],
 ['J','O',.1,.05]
];
const EDGES=RAW.map((r,i)=>{
  const a=r[0],b=r[1],p1=NODES[a],p2=NODES[b];
  const u=Math.hypot(p2[0]-p1[0],p2[1]-p1[1]);
  return {id:a+b,n:i+1,a:a,b:b,x1:p1[0],y1:p1[1],x2:p2[0],y2:p2[1],u:u,len:Math.round(u*SCALE),light:r[2],ppl:r[3]};
});
const ADJ={};
Object.keys(NODES).forEach(k=>{ADJ[k]=[];});
EDGES.forEach(e=>{ADJ[e.a].push(e);ADJ[e.b].push(e);});

const PLACES={
  dorm:{n:'A',kk:'Жатақхана',ru:'Общежитие',sk:'Жатақхана',sr:'Общежитие',lx:9,ly:-8,an:'start'},
  library:{n:'C',kk:'Кітапхана',ru:'Библиотека',sk:'Кітапхана',sr:'Библиотека',lx:9,ly:-8,an:'start'},
  main:{n:'G',kk:'Негізгі корпус',ru:'Главный корпус',sk:'Корпус',sr:'Корпус',lx:9,ly:-8,an:'start'},
  sport:{n:'I',kk:'Спорт кешені',ru:'Спорткомплекс',sk:'Спорт',sr:'Спорт',lx:9,ly:-8,an:'start'},
  bus:{n:'P',kk:'Аялдама',ru:'Остановка',sk:'Аялдама',sr:'Остановка',lx:-9,ly:-8,an:'end'},
  park:{n:'J',kk:'Саябақ кіреберісі',ru:'Вход в парк',sk:'',sr:'',lx:0,ly:0,an:'start'}
};
const HELP={
  security:{n:'F',kk:'Күзет бекеті',ru:'Пост охраны',sk:'Күзет',sr:'Охрана',lx:11,ly:-9,an:'start'},
  police:{n:'K',kk:'Полиция бекеті',ru:'Полицейский пост',sk:'Полиция',sr:'Полиция',lx:11,ly:-9,an:'start'},
  pharmacy:{n:'H',kk:'Дәріхана 24/7',ru:'Аптека 24/7',sk:'Дәріхана',sr:'Аптека',lx:-11,ly:22,an:'end'},
  store:{n:'L',kk:'Дүкен 24/7',ru:'Магазин 24/7',sk:'Дүкен',sr:'Магазин',lx:-11,ly:22,an:'end'},
  clinic:{n:'M',kk:'Емхана 24/7',ru:'Медпункт 24/7',sk:'Емхана',sr:'Медпункт',lx:11,ly:-9,an:'start'}
};

const S={lang:'kk',night:true,tab:'map',layers:{heat:true,help:true,lamps:false},
  pick:null,sel:null,from:'dorm',to:'bus',target:null,sosOn:false,needPos:false,rtype:'dark',reports:[]};

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function repCount(id){let c=0;for(const r of S.reports){if(r.edge===id)c++;}return c;}
function safety(e){
  let s=S.night?(.6*e.light+.4*e.ppl):(.2*e.light+.5*e.ppl+.3);
  s-=Math.min(.5,.2*repCount(e.id));
  return clamp(s,0,1);
}
function riskClass(s){return s>=.65?'safe':(s>=.4?'mid':'danger');}

function dijkstra(src,dst,cost){
  const dist={},prev={},pe={},Q=new Set(Object.keys(NODES));
  Q.forEach(n=>{dist[n]=Infinity;});
  dist[src]=0;
  while(Q.size){
    let u=null;
    Q.forEach(n=>{if(u===null||dist[n]<dist[u])u=n;});
    if(dist[u]===Infinity)break;
    Q.delete(u);
    if(u===dst)break;
    for(const e of ADJ[u]){
      const v=e.a===u?e.b:e.a;
      const alt=dist[u]+cost(e);
      if(alt<dist[v]){dist[v]=alt;prev[v]=u;pe[v]=e;}
    }
  }
  if(dist[dst]===Infinity)return null;
  const nodes=[],edges=[];
  let c=dst;
  while(c!==src){nodes.unshift(c);edges.unshift(pe[c]);c=prev[c];}
  nodes.unshift(src);
  return {nodes:nodes,edges:edges};
}
function stats(r){
  const len=r.edges.reduce((a,e)=>a+e.len,0);
  const sc=len?r.edges.reduce((a,e)=>a+e.len*safety(e),0)/len:1;
  const dark=r.edges.filter(e=>safety(e)<.4).length;
  return {nodes:r.nodes,edges:r.edges,len:len,min:Math.max(1,Math.round(len/WALK)),score:Math.round(sc*100),dark:dark};
}
function routesFor(fromKey,toKey){
  const s=PLACES[fromKey].n,d=PLACES[toKey].n;
  if(s===d)return null;
  const K=S.night?4:1.5;
  const safe=dijkstra(s,d,e=>e.len*(1+K*(1-safety(e))));
  const short=dijkstra(s,d,e=>e.len);
  if(!safe||!short)return null;
  const a=stats(safe),b=stats(short);
  return {safe:a,short:b,same:a.nodes.join()===b.nodes.join()};
}
function segDist(p,e){
  const dx=e.x2-e.x1,dy=e.y2-e.y1,l2=dx*dx+dy*dy;
  const u=clamp(((p.x-e.x1)*dx+(p.y-e.y1)*dy)/l2,0,1);
  return Math.hypot(p.x-(e.x1+u*dx),p.y-(e.y1+u*dy));
}
function nearestEdge(p){let b=null,bd=1e9;for(const e of EDGES){const d=segDist(p,e);if(d<bd){bd=d;b=e;}}return b;}
function nearestNode(p){let b=null,bd=1e9;for(const k in NODES){const d=Math.hypot(p.x-NODES[k][0],p.y-NODES[k][1]);if(d<bd){bd=d;b=k;}}return b;}
function featureAt(p){
  let best=null,bd=14;
  [['place',PLACES],['help',HELP]].forEach(g=>{
    for(const k in g[1]){const c=NODES[g[1][k].n];const d=Math.hypot(p.x-c[0],p.y-c[1]);if(d<bd){bd=d;best={type:g[0],key:k};}}
  });
  return best;
}
function nearPlace(p){let b=null,bd=1e9;for(const k in PLACES){const c=NODES[PLACES[k].n];const d=Math.hypot(p.x-c[0],p.y-c[1]);if(d<bd){bd=d;b=k;}}return b;}
function meNode(){return S.pick?nearestNode(S.pick):null;}
function areaSafety(node){const es=ADJ[node];return es.reduce((a,e)=>a+safety(e),0)/es.length;}
function helpList(){
  const me=meNode();
  if(!me)return [];
  return Object.keys(HELP).map(k=>{
    const r=dijkstra(me,HELP[k].n,e=>e.len);
    const len=r?r.edges.reduce((a,e)=>a+e.len,0):0;
    return {key:k,len:len,min:len?Math.max(1,Math.round(len/WALK)):0,nodes:r?r.nodes:[me]};
  }).sort((a,b)=>a.len-b.len);
}

function svgPoint(ev){
  const svg=$('svg'),m=svg.getScreenCTM();
  if(!m)return null;
  const pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;
  const p=pt.matrixTransform(m.inverse());
  return {x:clamp(p.x,0,360),y:clamp(p.y,0,350)};
}
function onMapClick(ev){
  const p=svgPoint(ev);
  if(!p)return;
  const f=featureAt(p);
  if(f){
    const c=NODES[(f.type==='place'?PLACES:HELP)[f.key].n];
    S.pick={x:c[0],y:c[1]};S.sel=f;
  }else{S.pick=p;S.sel=null;}
  S.needPos=false;
  if(S.tab==='sos'){S.target=null;S.sosOn=false;}
  render();
}
const pts=nodes=>nodes.map(n=>NODES[n][0]+','+NODES[n][1]).join(' ');
function lineOf(cls,e){return '<line class="'+cls+'" x1="'+e.x1+'" y1="'+e.y1+'" x2="'+e.x2+'" y2="'+e.y2+'"/>';}

function drawMap(){
  const showHeat=S.layers.heat;
  let heat='',st='',lamps='',routes='',reps='',help='',places='',me='';
  EDGES.forEach(e=>{
    const c=riskClass(safety(e));
    if(showHeat)heat+=lineOf('h-'+c,e);
    st+=lineOf('st-casing',e);
  });
  EDGES.forEach(e=>{
    st+=lineOf('st-in'+(showHeat?' c-'+riskClass(safety(e)):''),e);
  });
  if(S.layers.lamps){
    EDGES.forEach(e=>{
      const mx=Math.floor(e.u/18),n=Math.round(e.light*mx);
      for(let i=1;i<=n;i++){
        const f=i/(n+1);
        lamps+='<circle class="lamp" cx="'+(e.x1+(e.x2-e.x1)*f).toFixed(1)+'" cy="'+(e.y1+(e.y2-e.y1)*f).toFixed(1)+'" r="2"/>';
      }
    });
  }
  // выбранный участок
  if(S.pick&&((S.tab==='map'&&!S.sel)||S.tab==='report')){
    routes+=lineOf('sel-edge',nearestEdge(S.pick));
  }
  // маршруты
  if(S.tab==='route'){
    const R=routesFor(S.from,S.to);
    if(R){
      if(!R.same)routes+='<polyline class="r-short" points="'+pts(R.short.nodes)+'"/>';
      routes+='<polyline class="r-casing" points="'+pts(R.safe.nodes)+'"/><polyline class="r-safe" points="'+pts(R.safe.nodes)+'"/>';
      const a=NODES[PLACES[S.from].n],b=NODES[PLACES[S.to].n];
      routes+='<circle class="rs-a" cx="'+a[0]+'" cy="'+a[1]+'" r="7"/><circle class="rs-b" cx="'+b[0]+'" cy="'+b[1]+'" r="8"/><circle cx="'+b[0]+'" cy="'+b[1]+'" r="2.6" fill="#fff"/>';
    }
  }
  if(S.tab==='sos'&&S.sosOn&&S.target){
    const hl=helpList().filter(x=>x.key===S.target)[0];
    if(hl&&hl.nodes.length>1)routes+='<polyline class="r-casing" points="'+pts(hl.nodes)+'"/><polyline class="r-safe" points="'+pts(hl.nodes)+'"/>';
  }
  // жалобы
  const seen={};
  S.reports.forEach(r=>{
    const e=EDGES.filter(x=>x.id===r.edge)[0];
    if(!e)return;
    const i=seen[e.id]||0;seen[e.id]=i+1;
    const x=(e.x1+e.x2)/2+i*10,y=(e.y1+e.y2)/2;
    reps+='<g transform="translate('+x.toFixed(1)+','+y.toFixed(1)+')"><circle class="rep" r="7"/><text class="repx" y="3.5">!</text></g>';
  });
  // точки помощи
  if(S.layers.help||S.tab==='sos'){
    for(const k in HELP){
      const h=HELP[k],c=NODES[h.n];
      if(S.tab==='sos'&&S.sosOn&&S.target===k)help+='<circle class="tg-halo" cx="'+c[0]+'" cy="'+c[1]+'" r="16"/>';
      help+='<g><circle class="hp" cx="'+c[0]+'" cy="'+c[1]+'" r="9"/><path class="hp-x" d="M'+(c[0]-4)+' '+c[1]+'H'+(c[0]+4)+'M'+c[0]+' '+(c[1]-4)+'V'+(c[1]+4)+'"/>'+
        '<text class="lbl h" x="'+(c[0]+h.lx)+'" y="'+(c[1]+h.ly)+'" text-anchor="'+h.an+'">'+nm({kk:h.sk,ru:h.sr})+'</text></g>';
    }
  }
  // места
  for(const k in PLACES){
    const p=PLACES[k],c=NODES[p.n];
    places+='<circle class="pl" cx="'+c[0]+'" cy="'+c[1]+'" r="4.5"/>';
    const lab=nm({kk:p.sk,ru:p.sr});
    if(lab)places+='<text class="lbl" x="'+(c[0]+p.lx)+'" y="'+(c[1]+p.ly)+'" text-anchor="'+p.an+'">'+lab+'</text>';
  }
  // моя точка
  if(S.pick&&S.tab!=='route'){
    me='<circle class="me-halo" cx="'+S.pick.x.toFixed(1)+'" cy="'+S.pick.y.toFixed(1)+'" r="14"/><circle class="me-dot" cx="'+S.pick.x.toFixed(1)+'" cy="'+S.pick.y.toFixed(1)+'" r="6"/>';
  }
  $('g-heat').innerHTML=heat;$('g-st').innerHTML=st;$('g-lamps').innerHTML=lamps;$('g-routes').innerHTML=routes;
  $('g-reps').innerHTML=reps;$('g-help').innerHTML=help;$('g-places').innerHTML=places;$('g-me').innerHTML=me;
  $('parklbl').textContent=nm({kk:'Саябақ',ru:'Парк'});
  $('svg').setAttribute('aria-label',t('mapLabel'));
}

  if(S.pick){
    curKey='map';
    for(const k in PLACES){const c=NODES[PLACES[k].n];if(Math.hypot(S.pick.x-c[0],S.pick.y-c[1])<1)curKey=k;}
  }
  let o='<option value=""'+(curKey===''?' selected':'')+'>'+t('choose')+'</option>';
  Object.keys(PLACES).forEach(k=>{o+='<option value="'+k+'"'+(curKey===k?' selected':'')+'>'+nm(PLACES[k])+'</option>';});
  if(curKey==='map')o+='<option value="map" selected>'+t('mapPt')+'</option>';
  h+='<div class="h3">'+t('me')+'</div><select id="sel-me" aria-label="'+t('me')+'">'+o+'</select>';
  const L=helpList();
  if(L.length){
    h+='<div class="h3">'+t('nearest')+'</div><div class="rows">';
    L.forEach((x,i)=>{
      const d=x.len?x.len+' '+t('m')+' · '+t('walk',{n:x.min}):t('here');
      h+='<button class="row" data-act="target" data-v="'+x.key+'" aria-pressed="'+(S.sosOn&&S.target===x.key)+'"><div><div class="n">'+nm(HELP[x.key])+'</div><div class="d">'+d+'</div></div>'+(i===0?'<span class="badge">'+t('nearBadge')+'</span>':'')+'</button>';
    });
    h+='</div>';
    if(S.sosOn&&S.target){
      const x=L.filter(y=>y.key===S.target)[0];
      const msg=t('shareMsg',{p:nm(PLACES[nearPlace(S.pick)]),h:nm(HELP[x.key]),d:x.len});
      h+='<div class="h3">'+t('shareT')+'</div><div class="share" id="sharetxt">'+msg+'</div>'+
         '<div style="margin-top:8px"><button class="btn" data-act="copy">'+t('copy')+'</button></div>';
    }
  }
  return h;
}

function panelReport(){
  const e=S.pick?nearestEdge(S.pick):null;
  let h='';
  if(!e){h+='<div class="card"><div class="hint">'+t('rHint')+'</div></div>';}
  else{
    const s=safety(e);
    h+='<div class="card"><div class="head"><div><div class="tag">'+t('rPicked')+'</div><div class="ttl">'+t('seg',{n:e.n})+'</div><div class="tag">'+t('rNow')+'</div></div><div style="text-align:right">'+scoreBlock(s)+'</div></div></div>';
  }
  h+='<div class="h3">'+t('tabReport')+'</div><div class="chips" role="group">'+
     RTYPES.map(k=>'<button class="chip" data-act="rtype" data-v="'+k+'" aria-pressed="'+(S.rtype===k)+'">'+t('rt_'+k)+'</button>').join('')+'</div>';
  h+='<div style="margin-top:12px"><button class="btn p" data-act="submit"'+(e?'':' disabled')+'>'+t('rSubmit')+'</button></div>';
  h+='<div class="h3">'+t('mine')+'</div>';
  if(!S.reports.length)h+='<div class="hint">'+t('none')+'</div>';
  else{
    h+='<div class="rlist">';
    S.reports.slice().reverse().forEach(r=>{
      const ed=EDGES.filter(x=>x.id===r.edge)[0];
      h+='<div class="ritem"><div>'+t('rt_'+r.type)+'<small>'+t('seg',{n:ed.n})+'</small></div><button class="x" data-act="delrep" data-v="'+r.id+'" aria-label="'+t('del')+'">×</button></div>';
    });
    h+='</div><div style="margin-top:10px"><button class="btn" data-act="clear">'+t('clear')+'</button></div>';
  }
  h+='<p class="note">'+t('demoNote')+'</p>';
  return h;
}

function renderPanel(){
  const p=$('panel'),sc=p.scrollTop;
  p.innerHTML=({map:panelMap,route:panelRoute,sos:panelSos,report:panelReport})[S.tab]();
  p.scrollTop=sc;
}
function renderHeader(){
  $('sub').textContent=t('proto');
  document.querySelectorAll('[data-act="lang"]').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.v===S.lang));});
  const td=$('tod');
  td.innerHTML=svgi(S.night?'moon':'sun',16)+'<span>'+t(S.night?'night':'day')+'</span>';
  td.setAttribute('aria-pressed',String(S.night));
  td.setAttribute('aria-label',t('todLabel')+': '+t(S.night?'night':'day'));
}
function renderNav(){
  const items=[['map','tabMap'],['route','tabRoute'],['sos','tabSos'],['report','tabReport']];
  $('nav').innerHTML=items.map(i=>'<button data-act="tab" data-v="'+i[0]+'"'+(i[0]==='sos'?' class="sos"':'')+(S.tab===i[0]?' aria-current="page"':'')+'>'+svgi(i[0],22)+'<span>'+t(i[1])+'</span></button>').join('');
}
function render(){
  document.documentElement.lang=S.lang;
  renderHeader();drawMap();renderPanel();renderNav();
}

/* ---------- действия ---------- */
let tt=0;
function toast(m){const el=$('toast');el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{el.hidden=true;},2600);}
function copyText(){
  const el=$('sharetxt');
  if(!el)return;
  const text=el.textContent;
  const done=()=>toast(t('copied'));
  const fallback=()=>{
    try{const r=document.createRange();r.selectNodeContents(el);const s=window.getSelection();s.removeAllRanges();s.addRange(r);
      if(document.execCommand&&document.execCommand('copy')){done();return;}}catch(e){}
    toast(t('copyFail'));
  };
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,fallback);return;}}catch(e){}
  fallback();
}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');
  if(!b)return;
  const a=b.dataset.act,v=b.dataset.v;
  if(a==='copy'){copyText();return;}
  if(a==='tab'){S.tab=v;S.needPos=false;}
  else if(a==='lang'){S.lang=v;lsSet('csa.lang',v);}
  else if(a==='tod'){S.night=!S.night;}
  else if(a==='layer'){S.layers[v]=!S.layers[v];}
  else if(a==='swap'){const x=S.from;S.from=S.to;S.to=x;}
  else if(a==='sos'){
    if(!S.pick){S.needPos=true;render();const s=$('sel-me');if(s)s.focus();return;}
    S.needPos=false;S.target=helpList()[0].key;S.sosOn=true;
  }
  else if(a==='target'){S.target=v;S.sosOn=true;}
  else if(a==='rtype'){S.rtype=v;}
  else if(a==='submit'){
    if(!S.pick)return;
    const e=nearestEdge(S.pick);
    S.reports.push({id:String(Date.now())+String(Math.floor(Math.random()*1000)),edge:e.id,type:S.rtype,ts:Date.now()});
    saveReports();toast(t('thanks'));
  }
  else if(a==='delrep'){S.reports=S.reports.filter(r=>r.id!==v);saveReports();}
  else if(a==='clear'){S.reports=[];saveReports();}
  render();
});
document.addEventListener('change',ev=>{
  const id=ev.target.id,v=ev.target.value;
  if(id==='sel-from'){S.from=v;}
  else if(id==='sel-to'){S.to=v;}
  else if(id==='sel-me'){
    if(v&&PLACES[v]){const c=NODES[PLACES[v].n];S.pick={x:c[0],y:c[1]};S.sel=null;S.target=null;S.sosOn=false;S.needPos=false;}
    else if(!v){S.pick=null;S.target=null;S.sosOn=false;}
  }else return;
  render();
});

/* ---------- старт ---------- */
const savedLang=lsGet('csa.lang');
if(savedLang==='kk'||savedLang==='ru')S.lang=savedLang;
S.reports=loadReports();
initMap();
render();
})();
</script>
